[package]
name = "columnia"
version = "1.26.0"
description = "Estación local para preparar datos confiables"
license = "MIT"
edition = "2021"
default-run = "columnia"

[lib]
name = "columnia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The Windows linker can exhaust the PDB capacity on this dependency-heavy
# development binary. Release keeps its own symbols policy; dev/test builds do
# not need debugger symbols to run the local application or its gates.
[profile.dev]
debug = 0

[profile.test]
debug = 0

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
calamine = { version = "0.36.1", default-features = false, features = ["chrono"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
duckdb = { version = "1.10505.0", default-features = false, features = ["bundled", "json", "parquet"] }
hex = "0.4.3"
polars = { version = "0.55.2", default-features = false, features = ["csv", "fmt", "json", "parquet", "dtype-slim", "lazy", "regex", "strings", "concat_str", "semi_anti_join"] }
odbc-api = { version = "29.1.0", default-features = false, features = ["odbc_version_3_80"] }
rayon = "1.12"
regex = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
semver = "1.0.28"
sha2 = "0.11.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.3"
tempfile = "3"
tokio = { version = "1.53.1", features = ["macros", "sync"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
unicode-normalization = "0.1"
xxhash-rust = { version = "0.8.18", default-features = false, features = ["xxh3"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.12.0"
