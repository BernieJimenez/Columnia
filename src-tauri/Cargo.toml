[package]
name = "columnia"
version = "0.53.0"
description = "Estación local para preparar datos confiables"
license = "MIT"
edition = "2021"
default-run = "columnia"

[lib]
name = "columnia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
calamine = { version = "0.36.1", default-features = false, features = ["chrono"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
polars = { version = "0.55.2", default-features = false, features = ["csv", "fmt", "json", "parquet", "dtype-slim", "lazy", "regex", "strings"] }
regex = "1"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10.9"
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
tempfile = "3"
unicode-normalization = "0.1"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
