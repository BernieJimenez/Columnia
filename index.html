<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const storedTheme = localStorage.getItem("columnia.theme");
        const theme = ["system", "light", "dark", "paper", "ocean", "slate"].includes(storedTheme) ? storedTheme : "system";
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.resolvedTheme = theme === "system" ? (prefersDark ? "dark" : "light") : theme;
      } catch {
        document.documentElement.dataset.theme = "system";
        document.documentElement.dataset.resolvedTheme = "light";
      }
    </script>
    <title>Columnia</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
